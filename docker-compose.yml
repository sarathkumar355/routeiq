# Local development Postgres only. The API itself runs directly with
# uvicorn (see README) — nothing else is containerized in Phase 1.
services:
  db:
    image: postgres:16-alpine
    container_name: routeiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: routeiq
      POSTGRES_PASSWORD: routeiq
      POSTGRES_DB: routeiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
